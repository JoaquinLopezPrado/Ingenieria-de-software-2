services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centro_actividades
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    environment:
      - UV_LINK_MODE=copy
      - UV_PROJECT_ENVIRONMENT=/app/.venv
      - DB_HOST=db
      - DB_NAME=centro_actividades
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env.local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv        # Evita que el .venv de Docker sobrescriba el mio o viceversa
      - /app/.uv_cache   # Evita que el .uv_cache de Docker sobrescriba el mio o viceversa

  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"  # Ahora entrarás localmente por http://localhost:8080
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #     - frontend
  
  frontend:
     build:
       context: ./frontend
       dockerfile: Dockerfile
     ports:
       - "5173:5173"
     depends_on:
       - backend
     volumes:
       - ./frontend:/app
       - /app/node_modules

  # ngrok:
  #   image: ngrok/ngrok:latest
  #   restart: unless-stopped
  #   command: http nginx:80
  #   ports:
  #     - "4040:4040"  # Interfaz web local para ver el tráfico y copiar la URL pública
  #   env_file:
  #     - .ngrok.env.local
  #   depends_on:
  #     - backend
  #     - frontend

volumes:
  postgres_data:
